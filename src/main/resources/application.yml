# Savoris configuration.
# Defaults run the app locally (PostgreSQL on localhost, detailed logs).
# On a real server override with environment variables, e.g.
#   DB_URL, DB_USERNAME, DB_PASSWORD, BOOTSTRAP_PASSWORD, CORS_ALLOWED_ORIGINS,
#   JWT_PRIVATE_KEY_PATH=file:/secure/private_key.pem, JWT_PUBLIC_KEY_PATH=file:/secure/public_key.pem,
#   LOG_LEVEL_APP=INFO, LOG_LEVEL_SECURITY=WARN
spring:
  application:
    name: Savoris
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/savoris}
    username: ${DB_USERNAME:savoris}
    password: ${DB_PASSWORD:savoris123}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Release the DB connection as soon as the service is done, not after the JSON is written (measured: ~3x throughput at peak)
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${SQL_FORMAT:true}
        use_sql_comments: ${SQL_FORMAT:true}
    show-sql: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # The owner uploads the bank QR image; the service itself limits it to 2 MB
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

jwt:
  # Keys live in src/main/resources/certs (ignored by git). "file:/path" points outside the jar on a server.
  private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:certs/private_key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

savoris:
  cors:
    # Front-end origins allowed to call the API, comma separated (wildcards allowed)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://*.ngrok-free.dev,https://dine-chain-fe.vercel.app}
  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:None}
  # Empty database: create branches CN01-CN04 and one account per role
  # (admin, quanly, phucvu, daubep, kho) with this password. Change the password after the first login.
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    password: ${BOOTSTRAP_PASSWORD:savoris123}
  # VAT used until the owner sets one via PUT /settings/vat (8% = reduced rate for restaurants until end of 2026)
  vat-percent: 8
  loyalty:
    # 1 point per this many VND paid on a completed order
    earn-per: 10000
    # VND one point is worth when spent
    point-value: 1000
  takeaway:
    # Web takeaway not paid within this many minutes is cancelled (unless the guest said they transferred)
    payment-timeout-minutes: ${TAKEAWAY_PAYMENT_TIMEOUT_MINUTES:30}
  cloudinary:
    # cloudinary://API_KEY:API_SECRET@CLOUD_NAME (Cloudinary dashboard > API Keys). Empty = no photo upload;
    # the bank QR is then kept in the database
    url: ${CLOUDINARY_URL:cloudinary://821919131529351:6fU5WStecoFRD_LBAfwYF0sAE5Y@kizhftbe}
  media:
    storage-dir: ${MEDIA_STORAGE_DIR:./media}
  sepay:
    # API key set on the SePay webhook (Authorization: Apikey <key>). Empty = webhook off, the cashier confirms transfers
    api-key: ${SEPAY_API_KEY:}
  kitchen:
    # Max dish portions waiting/cooking per branch before takeaway & delivery are paused.
    # Override per branch with branches.kitchen_capacity (PUT /branches/{id}).
    default-capacity: 40

logging:
  level:
    root: INFO
    com.savoris: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

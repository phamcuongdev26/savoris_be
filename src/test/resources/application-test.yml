# Tests run on the real PostgreSQL, in their own schema "savoris_test": the schema is wiped and rebuilt by the
# Flyway migrations at the start of each test run, and the application's own data (schema "public") is never touched.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/savoris?currentSchema=savoris_test}
  flyway:
    schemas: savoris_test
    clean-disabled: false

logging:
  level:
    com.savoris: INFO
    org.springframework.security: WARN

savoris:
  # Tests create exactly the data they need
  bootstrap:
    enabled: false
  # Order totals in most tests are plain sums; VAT has its own tests that set the rate explicitly
  vat-percent: 0

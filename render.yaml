services:
  - type: web
    name: savoris-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/site/nav
    envVars:
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_URL
        sync: false
      - key: BOOTSTRAP_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://savoris-fe.vercel.app
      - key: CLOUDINARY_URL
        sync: false
      - key: SEPAY_API_KEY
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: None
